apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-maintenance
  labels:
    app.kubernetes.io/name: maintenance
    app.kubernetes.io/instance: maintenance-001
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: maintenance
      app.kubernetes.io/instance: maintenance-001
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintenance
        app.kubernetes.io/instance: maintenance-001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine
          command: [nginx]
          args: [-c, /etc/nginx/maintenance/nginx.conf, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /etc/nginx/maintenance
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: maintenance-content
        - name: tmp
          emptyDir: {}
